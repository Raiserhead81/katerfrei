server {
    listen 80;
    server_name katerfrei.gemivo.de;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name katerfrei.gemivo.de;

    ssl_certificate /etc/letsencrypt/live/katerfrei.gemivo.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/katerfrei.gemivo.de/privkey.pem;

    root /var/www/katerfrei;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /katerfrei.apk {
        default_type application/vnd.android.package-archive;
        expires 1h;
    }

    location ~* \.(?:js|css|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
